app:
  github:
    token: ${GITHUB_TOKEN} # env variable
    base-url: "https://api.github.com"
  stackoverflow:
    key: ${SO_TOKEN_KEY}
    access-token: ${SO_ACCESS_TOKEN}
    base-url: "https://api.stackexchange.com/2.3"
  bot-url: "http://localhost:8080"
spring:
  application:
    name: Scrapper
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8081

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
